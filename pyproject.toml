[project]
name = "askai-api"
version = "0.1.0"
description = "Ask AI — answer engine over Qatar national indicator data"
requires-python = ">=3.11"          # target is 3.13 (spine, Stack); 3.11 kept so the
                                    # domain layer runs on the current dev machine
dependencies = []                   # domain/ has none, and that is the point

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "import-linter"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/askai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/askai/domain"]        # AD-2: domain/ is pure, so it is checked strictly first

# ---------------------------------------------------------------- AD-2
# The dependency contract, enforced from the first commit. A violation
# fails the build; it is not a review comment.
[tool.importlinter]
root_package = "askai"

[[tool.importlinter.contracts]]
name = "domain imports nothing in-project"
type = "forbidden"
source_modules = ["askai.domain"]
forbidden_modules = [
    "askai.compile", "askai.validate", "askai.execute", "askai.assemble",
    "askai.narrate", "askai.respond", "askai.adapters", "askai.ports",
    "askai.rules", "askai.messages", "askai.api", "askai.refresh",
    "askai.observability",
]

[[tool.importlinter.contracts]]
name = "the pure layers never reach an adapter"
type = "forbidden"
source_modules = [
    "askai.compile", "askai.validate", "askai.assemble", "askai.narrate",
]
forbidden_modules = ["askai.adapters"]

[[tool.importlinter.contracts]]
name = "respond arranges packages, it never reaches inside one"
type = "forbidden"
source_modules = ["askai.respond"]
forbidden_modules = ["askai.assemble", "askai.narrate"]

[[tool.importlinter.contracts]]
name = "layers"
type = "layers"
layers = [
    "askai.api",
    "askai.respond",
    "askai.narrate",
    "askai.assemble",
    "askai.execute",
    "askai.validate",
    "askai.compile",
    "askai.domain",
]
