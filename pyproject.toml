[project]
name = "askai-api"
version = "0.1.0"
description = "Ask AI — answer engine over Qatar national indicator data"
requires-python = ">=3.13"
# Pinned exactly, not banded — the spine's version policy. FastAPI is pre-1.0
# and ships breaking minors, so it is reviewed on a cadence rather than tracked.
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "httpx==0.28.1",
    "uvicorn==0.53.0",
    "PyJWT==2.14.0",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.7",
    "mypy==2.3.1",
    "import-linter==2.15",
    "types-PyYAML==6.0.12.20260906",
]

[tool.uv]
# uv.lock is revision 3; an older uv cannot read what CI pins.
required-version = ">=0.12.14"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/askai"]
# PEP 561. Without it, mypy treats the *installed* askai as untyped, so a file checked
# on its own — tests/type_fixtures/*, which is how the negative assertions run — sees
# `Any` everywhere and the errors they assert on never appear.
force-include = { "src/askai/py.typed" = "askai/py.typed" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# ruff's own defaults, plus E501 so the declared line-length is actually enforced.
extend-select = ["E501"]

[tool.ruff.lint.isort]
# tests/ is not a package, so the corpus runner is imported by bare module name.
known-first-party = ["askai", "corpus_runner"]

[tool.mypy]
python_version = "3.13"
strict = true
# tests/ is checked too: the corpus runner is a gate, not a helper.
files = ["src/askai", "tests"]
mypy_path = ["tests"]
# The negative fixtures are *expected* to fail --strict; that is what they assert.
# mypy applies `exclude` when it walks a directory but not to a path named on the
# command line, so these stay out of the whole-tree run while
# tests/test_type_invariants.py can still check each one directly.
exclude = ['^tests[\\/]type_fixtures[\\/]']

# ---------------------------------------------------------------- AD-2
# The dependency contract, enforced from the first commit. A violation
# fails the build; it is not a review comment.
[tool.importlinter]
root_package = "askai"

[[tool.importlinter.contracts]]
name = "domain imports nothing in-project"
type = "forbidden"
source_modules = ["askai.domain"]
forbidden_modules = [
    "askai.compile", "askai.validate", "askai.execute", "askai.assemble",
    "askai.narrate", "askai.respond", "askai.adapters", "askai.ports",
    "askai.rules", "askai.messages", "askai.api", "askai.refresh",
    "askai.observability", "askai.config",
]

[[tool.importlinter.contracts]]
name = "the pure layers never reach an adapter"
type = "forbidden"
source_modules = [
    "askai.compile", "askai.validate", "askai.assemble", "askai.narrate",
]
forbidden_modules = ["askai.adapters"]

[[tool.importlinter.contracts]]
name = "respond arranges packages, it never reaches inside one"
type = "forbidden"
source_modules = ["askai.respond"]
forbidden_modules = ["askai.assemble", "askai.narrate"]

[[tool.importlinter.contracts]]
name = "layers"
type = "layers"
layers = [
    "askai.api",
    "askai.respond",
    "askai.narrate",
    "askai.assemble",
    "askai.execute",
    "askai.validate",
    "askai.compile",
    "askai.domain",
]
