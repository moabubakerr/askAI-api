# The Arabic half of the bilingual catalogue (FR-61, FR-62, FR-63, FR-63a, AD-11).
#
# Arabic is a first-class path, not a translation layer over an English answer. That is
# a structural claim, and this file is where it is either true or false: the Arabic
# wording is authored against the Arabic count, not derived from the English sentence.
#
# R-174 -- a counted noun in Arabic takes six forms, four of which English does not
# distinguish at all:
#
#   0        zero   نقصد جمعًا مجردًا           مؤشرات
#   1        one    المفرد                      مؤشر واحد
#   2        two    المثنى                      مؤشران
#   3-10     few    جمع القلة                   3 مؤشرات
#   11-99    many   المفرد المنصوب (تمييز)      11 مؤشرًا
#   100, 101 other  المفرد المجرور              100 مؤشر
#
# It is the last two digits that decide from 3 upward, so 103 takes the `few` form and
# 111 the `many` form. The loader requires all six on every counted message here; a
# missing dual stops startup rather than falling back to a plural that reads as an
# error to every Arabic speaker who sees it.
#
# R-175 -- the sentences under `sentence.*` agree in number with the count they carry,
# and name their unit through {counted} rather than containing one, so the unit is the
# one the reader asked in.
#
# Every id here exists in en.yaml and every id there exists here; the loader refuses to
# start otherwise.

version: 1

numbers:
  # Western digit shapes, deliberately. The published data uses them, the period
  # strings reject the Arabic-Indic ones outright -- so a figure and a period in one
  # sentence would otherwise disagree -- and R-174's own worked examples are written
  # "3 مؤشرات". The grouping and decimal marks are the Arabic ones: U+066C ARABIC
  # THOUSANDS SEPARATOR and U+066B ARABIC DECIMAL SEPARATOR.
  #
  # This is the editorial decision most likely to be revisited, and it is data for
  # exactly that reason: switching to "٠١٢٣٤٥٦٧٨٩" is a change to this line.
  digits: "0123456789"
  group_separator: "٬"
  decimal_separator: "٫"
  group_size: 3

messages:

  # ------------------------------------------------------------------ field labels

  label.value: "القيمة"
  label.unit: "الوحدة"
  label.period: "الفترة"
  label.country: "الدولة"
  label.source: "المصدر"
  label.indicator: "المؤشر"
  scope.national: "على المستوى الوطني"

  # ------------------------------------------------------------------ period forms
  #
  # The quarter is named, not numbered: "الربع الأول 2025", not "ر1 2025". A period
  # form is written the way the language writes it, not the English one with the words
  # replaced (FR-62).

  period.yearly: "{year}"
  period.quarterly: "{quarter} {year}"
  period.monthly: "{month} {year}"

  period.quarter.1: "الربع الأول"
  period.quarter.2: "الربع الثاني"
  period.quarter.3: "الربع الثالث"
  period.quarter.4: "الربع الرابع"

  period.month.1: "يناير"
  period.month.2: "فبراير"
  period.month.3: "مارس"
  period.month.4: "أبريل"
  period.month.5: "مايو"
  period.month.6: "يونيو"
  period.month.7: "يوليو"
  period.month.8: "أغسطس"
  period.month.9: "سبتمبر"
  period.month.10: "أكتوبر"
  period.month.11: "نوفمبر"
  period.month.12: "ديسمبر"

  # ------------------------------------------------------------------ the answer

  answer.value: "بلغ {detail} {value} {unit} في {period}."
  answer.value_for_country: "بلغ {detail} في {country} {value} {unit} في {period}."

  # ------------------------------------------------- what the answer did (FR-56, AD-23)
  #
  # The scope element -- which grain, which country scope and which period the answer
  # used. The separator is the Arabic comma U+060C and it is an id here rather than a
  # constant in code for the same reason the thousands mark is: which mark separates a
  # list is a per-language editorial decision, and the English one reaching an Arabic
  # sentence is exactly the drift the two files exist to prevent.
  #
  # `scope.national` is above, with the field labels, because it is the same phrase.

  scope.statement: "{grain}، {scope}، {period}"
  scope.named: "مقارنةً بـ{countries}"
  scope.benchmarks: "مقارنةً بدول المقارنة المعتمدة"
  scope.list_separator: "، "

  grain.monthly: "شهري"
  grain.quarterly: "ربع سنوي"
  grain.yearly: "سنوي"

  # ------------------------------------------------------ clarifications and refusals

  clarify.which_indicator: "أي مؤشر تقصد: {options}؟"
  clarify.which_period: "أي فترة تقصد بشأن {detail}؟"
  refusal.not_published: "هذه المعلومة غير متوفرة في البيانات المنشورة، ولا توجد إجابة يمكن تقديمها."
  refusal.not_supported: "البيانات المنشورة لا تتيح الإجابة عن هذا السؤال بصيغته الحالية."

  # ------------------------------------------------------ failures, said as failures
  #
  # عطل في أحد المكوّنات لا يُصاغ أبدًا كغياب للبيانات (AD-15). الرسالتان أدناه تصفان
  # المحرّك نفسه، لا البيانات المنشورة.

  failure.data_unavailable: "تعذّرت قراءة البيانات المنشورة في هذه اللحظة، فلم تُنتَج أي قيمة."
  failure.external_unavailable: "تعذّر الوصول إلى المصدر الخارجي، فلم يُدرَج منه شيء هنا."

  # ------------------------------------------------------------ the external caveat

  caveat.external: "هذا المحتوى ليس من البيانات المنشورة المعتمدة."

  # ------------------------------------------ series, change and targets (Epic 3)
  #
  # نقطة السلسلة لا تكرّر اسم المؤشر: الإجابة قد ذكرته، وتكراره في كل قراءة يجعل
  # السلسلة غير قابلة للقراءة. أما الفجوة فتذكر الفترة، لأن تسمية الفترة هي محتوى
  # العنصر نفسه (FR-45).
  #
  # الأساس يُكتب بالعربية من هذا الملف ولا يُنقل حرفيًا عن الإنجليزية (FR-63)، ويأتي
  # التغير دائمًا مع القراءة التي انتهى إليها ومع الفترتين، لأن نسبة بلا مرجع تدفع
  # القارئ إلى السؤال: مقارنةً بماذا؟

  series.point: "{period}: {value} {unit}"
  series.gap: "لا توجد قيمة منشورة لـ{period}."
  series.gaps_note: "لا توجد قيمة منشورة لـ{periods}."
  series.not_a_series: "ينشر {detail} تقييمًا لا رقمًا، فلا توجد سلسلة لعرضها."

  change.selected: "بلغ {detail} {value} {unit} في {later}، بتغير قدره {change} {change_unit} {basis} مقارنةً بـ{earlier}."
  change.computed: "بلغ {detail} {value} {unit} في {later}، مقابل {earlier_value} {unit} في {earlier} — أي تغير قدره {change} {change_unit} {basis}، محسوب هنا من هاتين القراءتين المنشورتين."
  change.not_published: "لا يتوفر رقم تغير منشور لـ{detail} {basis}."

  change.basis.yoy: "على أساس سنوي"
  change.basis.qoq: "على أساس ربع سنوي"
  change.basis.mom: "على أساس شهري"

  target.value: "المستهدف المنشور لـ{detail} هو {value} {unit} لـ{period}."
  target.not_published: "لا يوجد مستهدف منشور لـ{detail}."
  baseline.value: "خط الأساس المنشور لـ{detail} هو {value} {unit}، مقاسًا في {period}."
  baseline.not_published: "لا يوجد خط أساس منشور لـ{detail}."

  # ------------------------------------------------------------------ counted nouns

  count.indicator:
    zero: "مؤشرات"
    one: "مؤشر واحد"
    two: "مؤشران"
    few: "{count} مؤشرات"
    many: "{count} مؤشرًا"
    other: "{count} مؤشر"

  count.datapoint:
    zero: "نقاط بيانات"
    one: "نقطة بيانات واحدة"
    two: "نقطتا بيانات"
    few: "{count} نقاط بيانات"
    many: "{count} نقطة بيانات"
    other: "{count} نقطة بيانات"

  count.country:
    zero: "دول"
    one: "دولة واحدة"
    two: "دولتان"
    few: "{count} دول"
    many: "{count} دولة"
    other: "{count} دولة"

  count.year:
    zero: "سنوات"
    one: "سنة واحدة"
    two: "سنتان"
    few: "{count} سنوات"
    many: "{count} سنة"
    other: "{count} سنة"

  count.quarter:
    zero: "أرباع"
    one: "ربع واحد"
    two: "ربعان"
    few: "{count} أرباع"
    many: "{count} ربعًا"
    other: "{count} ربع"

  count.month:
    zero: "أشهر"
    one: "شهر واحد"
    two: "شهران"
    few: "{count} أشهر"
    many: "{count} شهرًا"
    other: "{count} شهر"

  # --------------------------------------------------------------- composed sentences
  #
  # The verb changes with the count as well as the noun: يطابق for one, يطابقان for the
  # dual, تطابق for the 3-10 plural. Rendering the noun first and dropping it into a
  # fixed sentence would get the noun right and the verb wrong -- which is why the
  # sentence and its noun are selected by the same count, in one call (R-175).

  sentence.found:
    zero: "لم نجد {counted} تطابق سؤالك."
    one: "وجدنا {counted} يطابق سؤالك."
    two: "وجدنا {counted} يطابقان سؤالك."
    few: "وجدنا {counted} تطابق سؤالك."
    many: "وجدنا {counted} يطابق سؤالك."
    other: "وجدنا {counted} يطابق سؤالك."

  sentence.available_for:
    zero: "{counted} متاحة لـ{detail}."
    one: "{counted} متاح لـ{detail}."
    two: "{counted} متاحان لـ{detail}."
    few: "{counted} متاحة لـ{detail}."
    many: "{counted} متاحًا لـ{detail}."
    other: "{counted} متاح لـ{detail}."

  # ============================================================ Epic 5 — the catalogue
  #
  # The Arabic half of the catalogue-question wordings. Authored beside the English rather
  # than translated from it: the counted sentences below take the dual and the plural of
  # paucity, which an English sentence has no form to translate from.

  # ------------------------------------------------------ counted nouns (Epic 5 additions)

  count.category:
    zero: "فئات"
    one: "فئة واحدة"
    two: "فئتان"
    few: "{count} فئات"
    many: "{count} فئة"
    other: "{count} فئة"

  count.group:
    zero: "مجموعات"
    one: "مجموعة واحدة"
    two: "مجموعتان"
    few: "{count} مجموعات"
    many: "{count} مجموعة"
    other: "{count} مجموعة"

  count.detail:
    zero: "سلاسل"
    one: "سلسلة واحدة"
    two: "سلسلتان"
    few: "{count} سلاسل"
    many: "{count} سلسلة"
    other: "{count} سلسلة"

  # ------------------------------------------------------------------- group answers

  sentence.group_holds:
    zero: "لا تضم {group} أي مؤشر."
    one: "تضم {group} {counted}."
    two: "تضم {group} {counted}."
    few: "تضم {group} {counted}."
    many: "تضم {group} {counted}."
    other: "تضم {group} {counted}."

  group.members: "{group}: {names}"
  group.list_separator: "، "

  sentence.group_entry:
    zero: "{name} ({counted})"
    one: "{name} ({counted})"
    two: "{name} ({counted})"
    few: "{name} ({counted})"
    many: "{name} ({counted})"
    other: "{name} ({counted})"

  group.breakdown: "تنقسم {group} إلى المجموعات التالية: {groups}"

  group.single_group: >-
    تضم {group} مجموعة واحدة تحمل الاسم نفسه، لذلك تُقدَّم الإجابة عن {group} ككل.

  group.ambiguous: "قد يعني «{name}» {readings}. أيهما تقصد؟"
  group.reading_separator: "، أو "

  sentence.group_reading_classification:
    zero: "الفئة {name}، وتضم {counted}"
    one: "الفئة {name}، وتضم {counted}"
    two: "الفئة {name}، وتضم {counted}"
    few: "الفئة {name}، وتضم {counted}"
    many: "الفئة {name}، وتضم {counted}"
    other: "الفئة {name}، وتضم {counted}"

  sentence.group_reading_entity:
    zero: "المجموعة {name} ضمن {classification}، وتضم {counted}"
    one: "المجموعة {name} ضمن {classification}، وتضم {counted}"
    two: "المجموعة {name} ضمن {classification}، وتضم {counted}"
    few: "المجموعة {name} ضمن {classification}، وتضم {counted}"
    many: "المجموعة {name} ضمن {classification}، وتضم {counted}"
    other: "المجموعة {name} ضمن {classification}، وتضم {counted}"

  # ---------------------------------------------------------- what periods exist (FR-4)

  periods.statement: "تنشر {detail} البيانات على النحو التالي: {calendars}."
  periods.at_grain: "{grain}، من {first} إلى {last}"
  periods.at_grain_single: "{grain}، {period} فقط"
  periods.separator: "؛ "

  periods.none_published: >-
    {detail} منشورة في الدليل لكنها لا تحمل أي نقاط بيانات، لذلك لا توجد فترات يمكن سردها.

  # ------------------------------------------------------------- published definitions

  definition.published: "{detail}: {definition}"

  definition.none_published: >-
    لا يوجد تعريف منشور لـ{detail}. لا يُولَّد تعريف بديل، ولا يُستبدل به التعريف المنشور
    باللغة الأخرى.

  # ------------------------------------------------------------ the executive overview

  overview.statement: "أحدث الأرقام المنشورة ضمن {group}: {members}"
  overview.member: "{name}، {value} {unit}، {period}"
  overview.member_absent: "{name}، لا يوجد رقم منشور"
  overview.member_separator: "؛ "

  overview.own_period_note: >-
    يُعرض كل رقم عند أحدث فترة منشورة له، ولا توجد فترة واحدة تغطي المجموعة كلها.

  # ---------------------------------------------------- what the engine can do (FR-32)

  sentence.capability_holds:
    zero: "لا أجد أي مؤشر في الدليل المنشور."
    one: "أجيب اعتمادًا على {counted} في الدليل المنشور."
    two: "أجيب اعتمادًا على {counted} في الدليل المنشور."
    few: "أجيب اعتمادًا على {counted} في الدليل المنشور."
    many: "أجيب اعتمادًا على {counted} في الدليل المنشور."
    other: "أجيب اعتمادًا على {counted} في الدليل المنشور."

  sentence.capability_with_data:
    zero: "لا يحمل أي مؤشر أرقامًا منشورة."
    one: "يحمل {counted} أرقامًا منشورة، فأستطيع تقديم القيم والسلاسل والتغير لها."
    two: "يحمل {counted} أرقامًا منشورة، فأستطيع تقديم القيم والسلاسل والتغير لها."
    few: "تحمل {counted} أرقامًا منشورة، فأستطيع تقديم القيم والسلاسل والتغير لها."
    many: "يحمل {counted} أرقامًا منشورة، فأستطيع تقديم القيم والسلاسل والتغير لها."
    other: "يحمل {counted} أرقامًا منشورة، فأستطيع تقديم القيم والسلاسل والتغير لها."

  sentence.capability_categories:
    zero: "لا ينقسم الدليل إلى أي فئة."
    one: "ينقسم الدليل إلى {counted}."
    two: "ينقسم الدليل إلى {counted}."
    few: "ينقسم الدليل إلى {counted}."
    many: "ينقسم الدليل إلى {counted}."
    other: "ينقسم الدليل إلى {counted}."

  sentence.capability_groups:
    zero: "ولا تضم هذه الفئات أي مجموعة."
    one: "وتضم هذه الفئات {counted} يمكنك السؤال عنها بالاسم."
    two: "وتضم هذه الفئات {counted} يمكنك السؤال عنهما بالاسم."
    few: "وتضم هذه الفئات {counted} يمكنك السؤال عنها بالاسم."
    many: "وتضم هذه الفئات {counted} يمكنك السؤال عنها بالاسم."
    other: "وتضم هذه الفئات {counted} يمكنك السؤال عنها بالاسم."

  sentence.capability_countries:
    zero: "لا توجد سلسلة تحمل أرقامًا لأكثر من دولة."
    one: "تحمل {counted} أرقامًا لأكثر من دولة، وإلى هذا الحد تصل المقارنة."
    two: "تحمل {counted} أرقامًا لأكثر من دولة، وإلى هذا الحد تصل المقارنة."
    few: "تحمل {counted} أرقامًا لأكثر من دولة، وإلى هذا الحد تصل المقارنة."
    many: "تحمل {counted} أرقامًا لأكثر من دولة، وإلى هذا الحد تصل المقارنة."
    other: "تحمل {counted} أرقامًا لأكثر من دولة، وإلى هذا الحد تصل المقارنة."

  capability.no_commentary: >-
    لا أحتفظ بتعليقات المحللين ولا بالمقالات المنشورة، لذلك لا أستطيع بيان سبب تغير رقم ما.

  capability.no_confidential_filter: >-
    لا يحمل أي مؤشر منشور تصنيف السرية، فلا يُحجب عنك شيء تحت هذا العنوان.

  # ------------------------------------------------------------------- the residual

  residual.unaccounted: "غير مُفسَّر بالمكونات المنشورة"

  residual.statement: >-
    {label}: {value} {unit}، محسوبة بطرح المكونات المنشورة من الإجمالي المعلن {total}.

  residual.exceeds: >-
    مجموع المكونات المنشورة يزيد على الإجمالي المعلن {total} بمقدار {value} {unit}. تُعرض
    المكونات كما نُشرت ولا تُعدَّل لتتطابق مع الإجمالي.

  # ------------------------------------------------------- comparison (Epic 4)
  #
  # أربع صيغ رفض مختلفة لا صيغة واحدة: غياب دول المقارنة في الإعداد شيء، وغياب القيم
  # المنشورة عنها شيء آخر. الدولة التي لا تنشر قيمة تبقى مذكورة في القائمة مع بيان
  # الغياب، ولا تُحذف.
  #
  # لا يُذكر اسم الدولة صاحبة البيانات في أي من هذه الرسائل؛ يُشار إليها بـ
  # `scope.national` كما في عنصر النطاق، لأن صفوفها هي الصفوف التي لا تحمل دولة.

  compare.countries_headline: "{detail}، مقارنةً بين الدول في {period}."
  compare.country_value: "{country}: {value} {unit}"
  compare.country_absent: "{country}: لا توجد قيمة منشورة لـ{period}."

  compare.no_declared_benchmarks: >-
    {detail} لا ينشر أي دولة مقارنة، فلا يمكن مقارنته بين الدول.

  compare.no_country_rows_at_all: >-
    {detail} يعلن دول مقارنة لكنه لا ينشر أي قيمة على مستوى الدول في {period}، فلا يوجد
    ما يُقارن.

  compare.indicators_headline: >-
    مقارنة بين المؤشرات، كل مؤشر في فترته المنشورة. الفترات غير موحّدة.

  compare.indicator_value: "{detail}: {value} {unit} ({period})"
  compare.indicator_absent: "{detail}: لا توجد قيمة منشورة لـ{period}."

  compare.units_differ: >-
    تُنشر هذه المؤشرات بوحدات مختلفة، فالأرقام غير قابلة للمقارنة المباشرة.

  # ------------------------------------------------------ superlatives and spreads

  extremum.highest_country: "{carrier} سجّلت أعلى {detail} في {period}: {value} {unit}."
  extremum.lowest_country: "{carrier} سجّلت أدنى {detail} في {period}: {value} {unit}."
  extremum.highest_period: "{carrier} هي الفترة الأعلى في {detail}: {value} {unit}."
  extremum.lowest_period: "{carrier} هي الفترة الأدنى في {detail}: {value} {unit}."

  extremum.direction_unpublished: >-
    {detail} لا ينشر اتجاهًا، لذلك اعتبرت هذه الإجابة القيمة {direction} هي الأفضل.

  direction.higher: "الأعلى"
  direction.lower: "الأدنى"

  rank.not_published: >-
    {detail} لا ينشر ترتيبًا، فلا يوجد ترتيب يمكن تقديمه، وهذه الإجابة لا تحتسب ترتيبًا.

  spread.between: >-
    الفارق في {detail} في {period} هو {value} {unit}، من {low_carrier} عند {low}
    {figure_unit} إلى {high_carrier} عند {high} {figure_unit}.

  spread.needs_two: >-
    {detail} ينشر أقل من قيمتين في هذا النطاق، فلا يوجد فارق يمكن حسابه.

  # ------------------------------------------------------------------- ordinals
  #
  # الترتيب في العربية كلمة لا لاحقة، ولهذا تُكتب الصيغ هنا كما تُكتب في اللغة بدل
