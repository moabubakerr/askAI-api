# Binding -- how each QuerySpec field reaches its final value, and what decides when the
# reader did not say.
#
# AD-19 fixes the precedence: named-in-question, then inherited-from-history, then the
# rule default below, then Unbound. The precedence is here rather than in code because
# the last two steps are decisions a reviewer is entitled to change without a deploy:
# what "no period named" means, and which scope a question with no country is about.
#
# The word tables are here for the same reason and one more -- they are bilingual, and a
# word list living in code is a word list Arabic gets added to last. Every phrase is
# written in the engine's normal form (askai.domain.normalise), because that is the form
# the question is folded to before it is compared; tests/test_compile.py asserts it.
area: BIND
about: >-
  How a question becomes a frozen QuerySpec: the precedence each field is bound by, the
  defaults that apply when the reader named nothing, and the bilingual words that count
  as naming a period, a grain, a measure or a country scope.

rules:
  - id: R-BIND-PRECEDENCE
    statement: >-
      Every QuerySpec field is bound by the same precedence, in this order: what the
      question named, then what the history carried forward, then the rule default,
      then Unbound with a stated reason. Exactly one binder owns each field's final
      value, and the precedence resolves before the spec is constructed.
    status: proposed
    kind: constant
    sources:
      - "docs/ARCHITECTURE-SPINE.md AD-19"
      - "docs/ARCHITECTURE-SPINE.md AD-1"
    values:
      order:
        - named-in-question
        - inherited-from-history
        - rule-default
        - unbound
    note: >-
      The order is data so that the four steps can be read in one place and cited in a
      review; the code walks these steps in this order and the test asserts the two
      agree, rather than the order being asserted twice.

  - id: R-BIND-DEFAULT-COUNTRY-SCOPE
    statement: >-
      A question naming no country is about the national series, which is a distinct
      query shape and never a country filter value. Naming the home country is naming no
      country: it appears in none of the published rows, so it resolves to this default
      rather than to a named set.
    status: proposed
    kind: constant
    sources:
      - "docs/ARCHITECTURE-SPINE.md AD-5"
      - "docs/PRD.md FR-10, FR-11b"
    values:
      scope: national
    note: >-
      The benchmark configuration names the home country in all 21 declared sets while
      the data names it in none of 8,127 rows, so a scope built by looking the country
      up by name retrieves every benchmark but it.

  - id: R-BIND-DEFAULT-MEASURE
    statement: >-
      A question naming no measure is asking for the actual value -- never a target and
      never a baseline, which are different published columns and different claims.
    status: proposed
    kind: constant
    sources:
      - "docs/PRD.md FR-15"
      - "docs/RULES.md R-101"
    values:
      measure: actual

  - id: R-BIND-DEFAULT-OPERATION
    statement: >-
      A question whose operation nothing has classified is a request for a value. In
      this epic nothing classifies one, because operation classification is a bounded
      model call-site and this epic makes no model call.
    status: proposed
    kind: constant
    sources:
      - "docs/ARCHITECTURE-SPINE.md AD-22"
      - "docs/PRD.md FR-15"
    values:
      operation: value
    note: >-
      Stated as a default rather than left implicit so that the day the classifier
      arrives, what it replaces is a named rule and not an assumption in a binder.

  - id: R-BIND-PERIODLESS-IS-LATEST
    statement: >-
      A question naming no period is about the latest reading, which compile leaves
      deferred for execute to resolve against the published data. It is never bound to a
      period compile picked, and never left unbound as though the reader was unclear.
    status: proposed
    kind: constant
    sources:
      - "docs/ARCHITECTURE-SPINE.md AD-1"
      - "docs/PRD.md FR-8"
    values:
      period: latest

  - id: R-BIND-GRAIN-FROM-DECLARED-DEFAULT
    statement: >-
      When no grain is named, the bound detail's declared default grain decides, never
      the grain of its most recent row. "Latest at a grain" is the last one reading at
      that grain, so a period-less question at a known grain is a deferred request for
      that many readings rather than an ungrained latest.
    status: proposed
    kind: constant
    sources:
      - "docs/PRD.md FR-5"
      - "docs/RULES.md R-83"
    values:
      readings: 1
    note: >-
      Inflation's latest actual is 2026-04 monthly, 2026-Q1 quarterly and 2025 yearly --
      all true, all different. Whichever row happens to be newest is the one signal that
      must not decide, which is why the count is stated here and the grain comes from
      the catalogue rather than from the data.

  - id: R-BIND-UNPUBLISHED-GRAIN-IS-STATED
    statement: >-
      When the grain the question named is not published for the bound detail, the
      period is left unbound with that as its stated reason. No adjacent grain is
      substituted, and a quarter is never answered with the year that contains it.
    status: proposed
    kind: code
    sources:
      - "docs/PRD.md FR-6"
      - "docs/RULES.md R-81"
    catalogue: ["R-81"]
    note: >-
      90 of 289 details publish at more than one grain, so substitution would be
      invisible far more often than it would be wrong-looking.

  - id: R-BIND-LATEST-WORDS
    statement: >-
      The words that name the latest reading rather than a period. A question carrying
      one of these has named its period, and the field is deferred rather than defaulted.
    status: proposed
    kind: table
    sources:
      - "docs/PRD.md FR-8"
      - "corpus/epic-1.yaml e1-002"
    values:
      words:
        - now
        - latest
        - current
        - currently
        - today
        - most recent
        - lately
        - right now
        - at present
        - at the moment
        - nowadays
        - these days
        - as of today
        - up to date
        - الان
        - حاليا
        - الحالي
        - احدث
        - اليوم
        - مؤخرا
        - هذه الايام
        - في الوقت الحالي
        - في الوقت الحاضر
        - الوقت الراهن
        - حتي الان
        - في الاونه الاخيره
    note: >-
      "Lately" and "right now" are the same request as "now": the most recent published
      reading. They name a period as surely as a date does, so the field is deferred for
      execute to resolve against the data rather than defaulted or left unbound.

  - id: R-BIND-GRAIN-WORDS
    statement: >-
      The words that name a publication interval without naming a period. A grain named
      this way outranks every other signal, including the grain of the most recent row
      and the grain a follow-up inherited.
    status: proposed
    kind: table
    sources:
      - "docs/PRD.md FR-4"
      - "corpus/epic-7.yaml e7-001"
    values:
      monthly_words:
        - monthly
        - month
        - per month
        - شهري
        - شهريا
        - الشهري
        - وشهريا
        - وشهري
      quarterly_words:
        - quarterly
        - per quarter
        - ربعي
        - ربع سنوي
        - الربعي
        - وربعي
        - وربع سنوي
      yearly_words:
        - yearly
        - annual
        - annually
        - per year
        - سنوي
        - سنويا
        - السنوي
        - وسنويا
        - وسنوي
    note: >-
      The bare word "quarter" is deliberately absent: it is how a quarter of a year is
      named ("the first quarter of 2026"), and reading it as an interval would turn a
      named period into a grain.

      The forms beginning with the Arabic conjunction are here because an Arabic
      follow-up is written as one word -- "وشهرياً" is the whole of "and monthly?" -- and
      the fold does not split a clitic off a word. They are listed rather than stripped
      because stripping a leading letter is a second normalisation in all but name, and
      there is exactly one of those (AD-26).

  - id: R-BIND-MEASURE-WORDS
    statement: >-
      The words that name a measure. A word inside the detail's own name never counts --
      an indicator called Growth is not a question about change -- so the span the detail
      bound from is excluded before these are read.
    status: proposed
    kind: table
    sources:
      - "docs/PRD.md FR-15"
      - "docs/ARCHITECTURE-SPINE.md AD-4"
    values:
      actual_words:
        - actual
        - الفعلي
        - القيمه الفعليه
      target_words:
        - target
        - targets
        - المستهدف
        - الهدف
      baseline_words:
        - baseline
        - خط الاساس
        - الاساس
      change_words:
        - change
        - growth
        - التغير
        - النمو

  - id: R-BIND-BENCHMARK-WORDS
    statement: >-
      The words that ask for whatever benchmark set the detail itself declares, rather
      than for a country the reader named. A named country always outranks these,
      because it is the more specific thing the reader said.
    status: proposed
    kind: table
    sources:
      - "docs/ARCHITECTURE-SPINE.md AD-5"
      - "docs/PRD.md FR-9"
    values:
      words:
        - benchmark
        - benchmarks
        - peers
        - peer countries
        - comparators
        - الدول المقارنه
        - الدول المرجعيه

  - id: R-BIND-MONTH-NAMES
    statement: >-
      The month a reader names in words, in both languages, mapped to its number. A
      month name with a year is a monthly period the question named outright.
    status: proposed
    kind: table
    sources:
      - "corpus/epic-1.yaml e1-001, e1-004"
      - "docs/DATA-CONTRACT.md period forms"
    values:
      months:
        january: 1
        jan: 1
        february: 2
        feb: 2
        march: 3
        mar: 3
        april: 4
        apr: 4
        may: 5
        june: 6
        jun: 6
        july: 7
        jul: 7
        august: 8
        aug: 8
        september: 9
        sep: 9
        sept: 9
        october: 10
        oct: 10
        november: 11
        nov: 11
        december: 12
        dec: 12
        يناير: 1
        فبراير: 2
        مارس: 3
        ابريل: 4
        مايو: 5
        يونيو: 6
        يوليو: 7
        اغسطس: 8
        سبتمبر: 9
        اكتوبر: 10
        نوفمبر: 11
        ديسمبر: 12

  - id: R-BIND-QUARTER-WORDS
    statement: >-
      The quarter a reader names in words, in both languages, mapped to its number. A
      quarter phrase with a year is a quarterly period the question named outright.
    status: proposed
    kind: table
    sources:
      - "corpus/epic-7.yaml e7-001"
      - "docs/DATA-CONTRACT.md period forms"
    values:
      quarters:
        first quarter: 1
        second quarter: 2
        third quarter: 3
        fourth quarter: 4
        1st quarter: 1
        2nd quarter: 2
        3rd quarter: 3
        4th quarter: 4
        quarter 1: 1
        quarter 2: 2
        quarter 3: 3
        quarter 4: 4
        q1: 1
        q2: 2
        q3: 3
        q4: 4
        الربع الاول: 1
        الربع الثاني: 2
        الربع الثالث: 3
        الربع الرابع: 4
        الربع 1: 1
        الربع 2: 2
        الربع 3: 3
        الربع 4: 4
    note: >-
      "Q4-2025" is how a reader writes the published period 2025-Q4, and the two are not
      the same string: the published form is the only one a datapoint is keyed by, so the
      reader's spelling is read here -- "q4" beside a year -- and turned into the
      published one. The fold collapses the hyphen, so "Q4-2025" arrives as "q4 2025" and
      needs no separate entry.

  - id: R-BIND-PERIOD-NOUNS
    statement: >-
      The nouns a reader counts periods in -- "years", "quarters", "months" and their
      Arabic forms -- keyed by the interval each one names. These count as naming a grain
      only inside a period expression: a noun on its own is how an indicator is described,
      and only a relative expression, a span or an ordinal turns one into an interval.
    status: proposed
    kind: table
    sources:
      - "docs/PRD.md FR-4, FR-5"
      - "corpus/epic-3.yaml e3-001, e3-002"
    values:
      monthly_nouns:
        - month
        - months
        - شهر
        - شهرا
        - اشهر
        - شهور
        - الشهر
        - الاشهر
        - الشهور
      quarterly_nouns:
        - quarter
        - quarters
        - ربع
        - ارباع
        - الربع
        - الارباع
        - ارباع السنه
      yearly_nouns:
        - year
        - years
        - سنه
        - سنوات
        - عام
        - اعوام
        - السنه
        - السنوات
        - العام
        - الاعوام
    note: >-
      These are deliberately separate from R-BIND-GRAIN-WORDS. "Quarter" as a bare word is
      how a quarter of a year is named ("the first quarter of 2026"), so reading it as an
      interval wherever it appears would turn a named period into a grain -- which is why
      the grain table leaves it out and this one, read only inside a period expression,
      carries it.

  - id: R-BIND-RELATIVE-PERIOD-WORDS
    statement: >-
      The words that point a period noun backwards from now -- "the last 5 years", "over
      the past 3 quarters", "العام الماضي". A relative expression names a count and an
      interval, so it binds to the last n periods at that interval and is deferred for
      execute to anchor on the published data; it is never resolved to a period here.
    status: proposed
    kind: table
    sources:
      - "docs/PRD.md FR-7"
      - "docs/ARCHITECTURE-SPINE.md AD-1, AD-17"
    values:
      back_words:
        - last
        - past
        - previous
        - prior
        - recent
        - trailing
        - اخر
        - الاخيره
        - الاخيرين
        - الماضيه
        - الماضي
        - الماضيين
        - الماضيتين
        - السابقه
        - السابق
        - المنصرمه
        - الفائته
    note: >-
      Arabic puts the qualifier after the noun ("السنوات الخمس الماضية") and English puts
      it before ("the last five years"), so the reader is matched on the *set* of parts a
      period expression is made of rather than on their order. That is one parser for both
      languages rather than one each, which is what makes the two resolve identically.

  - id: R-BIND-COUNT-WORDS
    statement: >-
      The counts a reader writes in words, in both languages, mapped to the number they
      name. A count written in digits is read as the digits it is; a count written in
      words is read here, so "the last five years" and "the last 5 years" are one request.
    status: proposed
    kind: table
    sources:
      - "docs/PRD.md FR-7"
      - "corpus/epic-3.yaml e3-001"
    values:
      counts:
        one: 1
        two: 2
        three: 3
        four: 4
        five: 5
        six: 6
        seven: 7
        eight: 8
        nine: 9
        ten: 10
        eleven: 11
        twelve: 12
        واحد: 1
        اثنين: 2
        اثنتين: 2
        ثلاث: 3
        ثلاثه: 3
        اربع: 4
        اربعه: 4
        خمس: 5
        خمسه: 5
        ست: 6
        سته: 6
        سبع: 7
        سبعه: 7
        ثماني: 8
        ثمانيه: 8
        تسع: 9
        تسعه: 9
        عشر: 10
        عشره: 10
        اثني عشر: 12
        الثلاث: 3
        الاربع: 4
        الخمس: 5
        الست: 6
        السبع: 7
        الثماني: 8
        التسع: 9
        العشر: 10

  - id: R-BIND-PERIOD-RANGE-WORDS
    statement: >-
      The words that make two named periods a span rather than two separate readings --
      "from 2019 to 2025", "من 2021 إلى 2025" -- and the words that make them a comparison
      instead. Two periods with a span word between them bind to a range; two periods with
      a comparison word are left unbound, because a comparison of two readings and a run
      of readings across them are different questions.
    status: proposed
    kind: table
    sources:
      - "docs/PRD.md FR-7, FR-16, FR-23"
      - "corpus/epic-3.yaml e3-001, e3-002, e3-006"
    values:
      from_words:
        - from
        - since
        - starting
        - starting from
        - beginning
        - as of
        - من
        - منذ
        - ابتداء من
        - اعتبارا من
        - بدايه من
      to_words:
        - to
        - until
        - till
        - through
        - up to
        - ending
        - onwards
        - الي
        - حتي
        - وحتي
        - لغايه
        - الي غايه
      comparison_words:
        - between
        - compare
        - compared
        - comparison
        - versus
        - vs
        - بين
        - قارن
        - مقارنه
        - مقابل
    note: >-
      "Between 2019 and 2025" is deliberately a comparison word and not a span word, in
      both languages. Arabic writes a two-period comparison as "بين عامي 2022 و2025" and
      English writes one as "between 2022 and 2025"; reading either as a range would turn
      the question FR-23 is about into the question FR-16 is about. A reader who means the
      span says "from ... to ...", and that is the form that binds to a range.

  - id: R-BIND-OPEN-RANGE-ENDS-AT-TODAY
    statement: >-
      A range whose end the reader left open -- "since 2019", "منذ 2019" -- ends at the
      period containing today, at the grain the reader's own start period names. Today is
      an input to compiling and never a clock read, so an open range compiles to the same
      span on every run and stops being the same span the day after it is asked.
    status: proposed
    kind: constant
    sources:
      - "docs/PRD.md FR-7"
      - "docs/ARCHITECTURE-SPINE.md AD-17"
    values:
      end: today
    note: >-
      The alternative -- ending the range at the newest published period -- would be a
      data read inside compile, which is the one thing AD-1 puts out of reach. Ending at
      today is determinate before any data access, and a span that runs past the last
      published reading is execute's to state as a gap, not compile's to shorten.

  - id: R-BIND-PERIOD-PREFIXES
    statement: >-
      The one-letter Arabic conjunctions a reader writes joined to a period -- "و2025" is
      the whole of "and 2025". A period token carrying one of these is read as the period
      it names, so that a question listing two periods in Arabic names two periods, as the
      same question in English does.
    status: proposed
    kind: table
    sources:
      - "docs/PRD.md FR-7, FR-63"
      - "corpus/epic-3.yaml e3-006"
    values:
      prefixes:
        - و
        - ف
    note: >-
      This is not a second normalisation (AD-26): the fold is untouched, and nothing here
      changes how text is compared. It is a list of the spellings a *published period*
      arrives in, read in the one module that turns a reader's spelling into a published
      one -- the same job "Q4-2025" needs doing. A word list is what the grain table does
      for the same clitic, and a year cannot be listed that way because every year would
      need its own entry.
