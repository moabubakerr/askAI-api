# Epic 5 — Questions about the catalogue itself.
#
# Counts, lists, ownership, definitions, capability. Grouping is read from P01
# (IndicatorEntityTypeId, 189/189 resolvable) through Sectors.csv and General Entities.csv;
# ownership through their ChampionId into Champions.csv. All figures read on 2026-09-15.
#
# `measure: null` on these entries means no `Measure` member applies — nothing numeric is
# being measured, the question is about the catalogue. It is not a new enum value.

- id: e5-001
  spec_version: 1
  question:
    en: How many indicators are there under economic diversification targets?
    ar: كم عدد المؤشرات ضمن مؤشرات التنويع الاقتصادي؟
  today: 2026-09-15
  operation: count
  measure: null
  why: >-
    Epic 5 / Story 5.1 and recorded failure F-032, where QC expected 12. P01's
    `DiversificationTargets` classification holds exactly 12 indicators, all under the single
    entity `Economic Diversification Targets` / "مؤشرات التنويع الاقتصادي". This was answerable
    all along; the group layer was simply never queryable.

- id: e5-002
  spec_version: 1
  question:
    en: What indicators are in the education sector?
    ar: ما هي مؤشرات قطاع التعليم؟
  today: 2026-09-15
  operation: list
  measure: null
  why: >-
    Epic 5 / Story 5.1 and recorded failure F-033. `Education Sector` / "التعليم"
    (Sectors.csv) carries 13 published indicators, including `Sector Contribution To GDP
    (Education)`, `Graduates from STEM ( Share of All Graduates )` and
    `Program for International Student Assessment (PISA) Rank`.

- id: e5-003
  spec_version: 1
  question:
    en: Which sector has the most indicators?
    ar: أي قطاع يضم أكبر عدد من المؤشرات؟
  today: 2026-09-15
  operation: extremum
  measure: null
  why: >-
    Epic 5 / Story 5.2 — distinguish a group from a classification. Within the `Sectors`
    classification (105 indicators) the largest entity is `Transportation and Storage` with
    23, ahead of `Agriculture, Livestock and Fisheries` (16). The answer must be about the
    group, not the classification, which is finding 67's whole point.

- id: e5-004
  spec_version: 1
  question:
    en: Who owns the tourism sector indicators?
    ar: من الجهة المسؤولة عن مؤشرات قطاع السياحة؟
  today: 2026-09-15
  operation: list
  measure: null
  why: >-
    Epic 5 / Story 5.4 — ownership. `Tourism` / "السياحة" holds 7 indicators and its
    ChampionId resolves to `Qatar Tourism` in Champions.csv. A champion owns a group and is
    never itself a group, so the answer names the owner of a named group rather than
    treating Champions as a grouping table. Recorded as `list` because the `Operation` enum
    has no member for an ownership lookup; if 1.11 needs one this entry is where it shows up.

