- id: e5-009
  spec_version: 1
  question:
    en: Which indicators are confidential?
    ar: ما هي المؤشرات السرية؟
  today: 2026-09-15
  operation: list
  measure: null
  expected: refusal
  refusal_reason: >-
    The question is well formed and the data cannot answer it. `P13_Ref_IndicatorPriorityTypes`
    defines three priority types including `Confidential`, but none of the 189 published
    indicators carries it — 105 are `Priority` and 84 carry no priority type at all. The
    answer says the classification exists and nothing published is marked with it; it does
    not report an empty list as though it had searched and found none.
  why: >-
    Epic 5 / Story 5.9 — name the residual honestly. This is the one refusal in the corpus
    that exists because a vocabulary was published without any data behind it, the same shape
    as P10 and P11 being empty files. Measured on 2026-09-15 against P01 and P13.
