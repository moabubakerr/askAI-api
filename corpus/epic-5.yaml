- id: e5-011
  spec_version: 1
  question:
    en: How many indicators are in transportation?
    ar: كم عدد المؤشرات في النقل؟
  today: 2026-09-16
  operation: count
  measure: null
  expected: clarification
  why: >-
    Epic 5 / Story 5.2, FR-2 and AD-25. Where one word reads at both levels of the group
    layer the engine names both readings with their sizes and picks neither. The sizes are
    what makes the clarification useful rather than pedantic: the two readings of a sector
    name differ by up to 98 indicators, and a reader shown "105 or 23?" can answer
    instantly. Recorded as a clarification, not a refusal — the data can answer, the
    question has not yet said which question it is.

- id: e5-012
  spec_version: 1
  question:
    en: What periods are available for inflation?
    ar: ما هي الفترات المتاحة لمعدل التضخم؟
  today: 2026-09-16
  operation: list
  measure: null
  why: >-
    Epic 5 / Story 5.3 and FR-4. 90 of the 289 published details publish at more than one
    grain, and the answer states each grain's span separately. A merged calendar is true of
