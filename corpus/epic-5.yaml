    nothing after being told the data was there.

- id: e5-013
  spec_version: 1
  question:
    en: What periods are available for a detail that publishes no data?
    ar: ما هي الفترات المتاحة لسلسلة لا تنشر أي بيانات؟
  today: 2026-09-16
  operation: list
  measure: null
  why: >-
    Epic 5 / Story 5.3. 28 of the 289 published details carry no data points at all. The
    answer states that the detail is published and carries no data — a distinct statement
    from "no such detail", which is what the reader would otherwise be told. The two reach
    a reader as different sentences and are different element classes (`absent` against a
    refusal), so an implementation collapsing them fails this entry rather than passing it
    with a plausible message.

- id: e5-014
  spec_version: 1
  question:
    en: What does sector contribution to GDP mean?
    ar: ماذا تعني مساهمة القطاع في الناتج المحلي الإجمالي؟
  today: 2026-09-16
  operation: definition
  measure: null
  expected: answer
  why: >-
    An **answer**, not a refusal: the engine answers with an element of class `absent`
    carrying the statement that no definition is published, which is content rather than a
    missing element. A refusal would say the published data cannot answer the question, and
    it can — it answers that nothing is published.
    Epic 5 / Story 5.7 — the `-` case the story requires an entry for. 88 of 289 published
    details carry `-` as their English definition and 89 carry it in Arabic, against 143
    distinct English definitions in all. The answer states that no definition is published;
    it does not render the hyphen, and it does not substitute the other language's text.
    Note where this is actually enforced today: FR-64's ingest normalisation already drops
    a `-` before it reaches the read model, and `R-META-PLACEHOLDER-IS-NOT-A-DEFINITION` is
    the second line for a spelling the ingest does not recognise.

- id: e5-015
  spec_version: 1
  question:
    en: What is real GDP made up of?
    ar: مم يتكون الناتج المحلي الإجمالي الحقيقي؟
  today: 2026-09-16
  operation: list
  measure: null
  why: >-
    **Blocked.** The read model has no sub-indicator membership table: `P07a` carries 113
    memberships over 110 distinct details for 24 indicators, and the ingest of Story 1.8
    materialises none of them. Story 5.8 cannot be built until a table exists, which is a
    schema change with an owner. The entry is written now because it is the story's own
    acceptance criterion, and an entry written after the table would be written to match
    whatever was built.
    Epic 5 / Story 5.8, and the entry the story asks for by name: one that **would pass
    under a sibling implementation and fail under the correct one**. Components come from
    the declared sub-indicator membership at the detail level. Two indicators sharing a
    group are siblings and are never parts of each other, so an implementation that
    answered from the group layer would return this indicator's group-mates and satisfy
    every count in the answer while being wrong about what the words mean. Membership is
    many-to-many — 3 details belong to more than one chart — so it is its own entity and
    never a field on a detail.

- id: e5-016
  spec_version: 1
  question:
    en: What share of the total does each component account for?
    ar: ما نسبة كل مكون من الإجمالي؟
  today: 2026-09-16
  operation: list
  measure: actual
  why: >-
    Epic 5 / Story 5.9, and the accounting contract the story requires an entry for: the
    stated total, the stated parts and the stated residual are mutually consistent and
    individually sourced. The residual is classed `derived` with its inputs named, it is
    not called "other" unless a published component is named that way, and the published
    parts are never adjusted to make them sum. Where the parts exceed the total there is no
    remainder to name and the inconsistency is reported instead. The arithmetic is built
    and tested; its input is blocked with e5-015.

- id: e5-017
  spec_version: 1
  question:
    en: Can you chart inflation over the last five years?
    ar: هل يمكنك رسم معدل التضخم خلال السنوات الخمس الماضية؟
  today: 2026-09-16
  operation: series
  measure: actual
  why: >-
    **Blocked on its input.** The read model has no chart table: `INDICATOR ||--||
    CHART_CONFIG` is one per indicator, 189/189, published in `P07` with the alternate
    views split into `P07b`, and the ingest materialises neither. Until it does, every
    answer's `chartable` block states unavailable — which is the correct answer for an
    engine holding no configuration, and is what `chartable_for(rule_set, None, ...)`
    returns today.
    Epic 5 / Story 5.10 and recorded failure F-035. The block states availability, the
    default view and the named alternate views, all read from the published configuration.
    The direction of the check is the whole point: the client renders what it is offered,
    so the engine offers only what the configuration declares — never a view it could
    compute but the configuration does not name.

- id: e5-018
  spec_version: 1
  question:
    en: What are the national indicators?
    ar: ما هي المؤشرات الوطنية؟
  today: 2026-09-16
  operation: list
  measure: null
  why: >-
    Epic 5 / Story 5.1, the degenerate container case. `NationalIndicators` holds 8
    indicators under the single entity `National Economic Indicators`, and
    `DiversificationTargets` holds 12 under `Economic Diversification Targets`. Each is a
    real 1:1 and not an absent entity, so the answer is given at classification level and
