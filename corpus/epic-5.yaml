- id: e5-010
  spec_version: 1
  question:
    en: What indicators are in Sectors?
    ar: ما هي المؤشرات ضمن القطاعات؟
  today: 2026-09-16
  operation: list
  measure: null
  why: >-
    Epic 5 / Story 5.2 and the catalogue's R-165. `Sectors` is the *classification*: 105
    indicators across 8 entities — Transportation and Storage (23), Agriculture, Livestock
    and Fisheries (16), Financial and Insurance Activities (15), Health and Social Services
    (15), Education Sector (13), Manufacturing (9), Tourism (7), Information and
