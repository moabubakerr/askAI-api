- id: e5-007
  spec_version: 1
  question:
    en: What's the latest in Qatar's economy?
    ar: ما هي آخر مستجدات الاقتصاد القطري؟
  today: 2026-09-15
  operation: list
  measure: actual
  why: >-
    Epic 5 / Story 5.5 — the executive overview, read from the catalogue's
    `NationalIndicators` classification: exactly 8, all active — FDI Stock, Real GDP, Total
    Exports (Goods and Services), Gross National Income, Inflation, Government Revenues,
    Trade Balance (Goods & Services), Public Debt as a Percentage of GDP (%). Each at its own
    latest period, no common period forced: Gross National Income stops at 2023 while
    Government Revenues reaches 2026-Q1, so forcing one period would drop or misdate members.

- id: e5-008
  spec_version: 1
  question:
    en: What can you do?
    ar: ماذا يمكنك أن تفعل؟
  today: 2026-09-15
  operation: explanation
  measure: null
  why: >-
    Epic 5 / Story 5.6 and recorded failure F-007, which returned nothing. The answer is
    grounded in the data held, not a feature list: value, series and change over 161
