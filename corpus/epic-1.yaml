# Epic 1 — Foundations and the first traceable answer.
#
# One named indicator, one correct figure, with unit, period, scope and source.
# Every indicator, period and value named below was read from data/cms/ on 2026-09-15.
#
# Entry shape is provisional until Story 1.11 (see corpus/README.md). Each entry carries
# only: spec_version, question (en / ar), today, operation, measure, why — and for a
# refusal, `expected: refusal` with a reason. `measure: null` means no `Measure` member
# applies (the question asks for nothing numeric); it is not a new enum value.

- id: e1-001
  spec_version: 1
  question:
    en: What was inflation in Qatar in April 2026?
    ar: كم بلغ معدل التضخم في قطر في أبريل 2026؟
  today: 2026-09-15
  operation: value
  measure: actual
  why: >-
    Epic 1 / Story 1.12 — the canonical single value. `Inflation` is the one detail named
    exactly "Inflation" (P02), publishes Monthly/Quarterly/Yearly per P06, and its latest
    national monthly actual is 2026-04 = 2.6162 %. The grain is named in the question, so
    FACT 1's "grain from the question" arm is exercised.

- id: e1-002
  spec_version: 1
  question:
    en: What is inflation now?
    ar: ما هو معدل التضخم الآن؟
  today: 2026-09-15
  operation: value
  measure: actual
  why: >-
    Epic 1 / Story 1.12 and AD-1's `Deferred` state — "now" names `Latest`, determinate but
    unresolvable before the data. Also the F-029 trap: Inflation's latest actual is 2026-04
    monthly, 2026-Q1 quarterly and 2025 yearly, all true and all different, so the detail's
    declared default grain must decide, never the data's last row.

- id: e1-003
  spec_version: 1
  question:
    en: What was Qatar's Real GDP in 2025?
    ar: كم بلغ الناتج المحلي الإجمالي الحقيقي لدولة قطر في عام 2025؟
  today: 2026-09-15
  operation: value
  measure: actual
  why: >-
    Epic 1 — a yearly value with a unit that is not a percentage. `Real GDP` (P01,
    NationalIndicators) publishes Quarterly and Yearly actuals from 2019; the 2025 yearly
    national actual is 736.638, unit QAR, format bn0.0, source National Planning Council.
    Exercises the provenance envelope and the single formatter (Story 1.13).

- id: e1-004
  spec_version: 1
  question:
    en: How many international visitors came to Qatar in March 2026?
    ar: كم عدد السياح من خارج الدولة الذين زاروا قطر في مارس 2026؟
  today: 2026-09-15
  operation: value
  measure: actual
  why: >-
    Epic 1, Arabic as a first-class path. `Number of International Visitors` publishes
    monthly from 2019-01; 2026-03 national actual is 1.132, unit Count, format 0.000m.
    The Arabic name published for the indicator is "عدد السياح من خارج الدولة".

- id: e1-005
  spec_version: 1
  question:
    en: What percentage of Qatar's energy is generated by solar?
    ar: ما نسبة الطاقة المولدة من الطاقة الشمسية في قطر؟
  today: 2026-09-15
  operation: value
  measure: actual
  expected: refusal
  refusal_reason: >-
    The indicator exists in the published catalogue but carries no datapoints at all, so
    there is no figure to give. This is distinct from "no such indicator" and from "no data
    for the period you asked about".
  why: >-
    Epic 1 / the nameable-but-unanswerable refusal. `Percentage of energy generated by
    solar` is one of the 28 published indicators (of 189) with zero rows in P03 — measured
    on 2026-09-15. The refusal must name the cause, not report "no data".

- id: e1-006
  spec_version: 1
  question:
    en: What is Qatar's diabetes rate?
    ar: ما هو معدل داء السكري في قطر؟
  today: 2026-09-15
  operation: value
  measure: actual
  expected: refusal
  refusal_reason: >-
    `Diabetes Rate` is published in the catalogue but has no published datapoints, so the
    honest answer names the indicator and says no figures have been published for it.
  why: >-
    Epic 1 — the same refusal as e1-005 reached from an Arabic question, to prove the
    refusal wording has bilingual parity (Story 1.5, Story 10.4). Second of the 28
    zero-datapoint published indicators, Arabic name "معدل داء السكري".
