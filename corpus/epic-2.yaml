# ---------------------------------------------------------------------------------------
# Batch 1 of the refusal stories — 2.7, 2.9, 2.10 and 2.11, added 2026-09-17.
#
# The entries above state how the ladder *reaches* an answer. These state what the reader
# is told when it cannot, and each pins one of the six causes to a fact read off the
# export rather than to a hypothetical. The runner compiles them against an empty
# catalogue, so what it gates here is totality and determinism; which of the six each one
# is said as is asserted in `tests/test_refusals.py`, against the same questions.

- id: e2-021
  spec_version: 1
  question:
    en: How does Total Population compare across the benchmark countries?
    ar: كيف تُقارَن إجمالي السكان بين دول المقارنة؟
  today: 2026-09-17
  operation: comparison
  measure: actual
  expected: refusal
  refusal_reason: >-
    `Total Population` is the only one of the 21 declared benchmark sets with **zero**
    country rows. It declares benchmark countries and publishes no country values, which
    is "no data for this selection" — the fourth cause — and not "not a declared
    benchmark", which is the fifth. Telling this reader the indicator declares no
    benchmarks would be false about the configuration; telling them it is not published
    would be false about the data.
  why: >-
    Epic 2 / Story 2.7 — the worked example that separates cause four from cause five on a
    real row. The two are one edit apart in the export and three sentences apart to a
    reader: one is fixed by whoever loads the country rows, the other by whoever declares
    the benchmark set.

