    refusal that could not distinguish them would be the silent failure AD-15 prevents.

- id: e2-018
  spec_version: 1
  question:
    en: What is it?
    ar: ما هو؟
  today: 2026-09-16
  operation: value
  measure: actual
  expected: refusal
  refusal_reason: >-
    The question is entirely framing vocabulary and names no subject at all.
  why: >-
    Epic 2 / Story 2.3's degenerate case, and the one that would be a silent disaster.
    Stripping removes every word, and scoring an empty subject would return an arbitrary
    slice of the collection ordered by nothing — a confident answer about whichever indicator
    happened to sort first. So the subject is never allowed to become empty: the question as
    asked is used instead, and the worst case is the behaviour before stripping rather than a
    candidate list with no relationship to what was asked.

- id: e2-019
  spec_version: 1
  question:
    en: What was inflation in April 2026?
    ar: كم بلغ معدل التضخم في أبريل 2026؟
  today: 2026-09-16
  operation: value
  measure: actual
  why: >-
    Epic 2 / NFR-1 and AD-17 — the same question resolves identically on every run, asserted
    here by the runner compiling it twice. It matters more in this epic than in Epic 1: the
    ladder sorts on a discrimination score, and an unstable tie-break would make the same
    question bind different details on different runs. The order is total — score, then the
    order stage 1 delivered, then the detail id — and stage 1's order is the middle key
    deliberately. Falling back on the detail id instead was measured dropping exact recall@1
    from 96.0% to 80.0% and the overall figure from 73.2% to 63.4%.

- id: e2-020
  spec_version: 1
  question:
    en: Inflation monthly
    ar: التضخم الشهري
  today: 2026-09-16
  operation: value
  measure: actual
  why: >-
    Epic 2 / Story 2.4's grain veto and FR-6, on a detail that does publish monthly so the
    veto does not fire. `Inflation` publishes Monthly, Quarterly and Yearly per P06. The veto
    exists for the other case: a detail publishing only yearly rows, asked for monthly, is
    **out** rather than ranked lower, because a weight — however large — can always be
    outvoted by enough of the others. It fires only where the catalogue actually records
    which grains exist; a detail whose periods the export never recorded is not vetoed,
    because a veto on missing evidence removes candidates for a gap in the export rather
    than for a mismatch.
