- id: e2-028
  spec_version: 1
  question:
    en: What is the average PISA test score?
    ar: ما هو متوسط درجات اختبار البرنامج الدولي لتقييم الطلبة؟
  today: 2026-09-17
  operation: value
  measure: actual
  expected: refusal
  refusal_reason: >-
    Unapproved in both languages. Where the base layer cannot be read at all, the answer is
    the plain "no such indicator" it would otherwise have been, with a typed degradation
    beside it — never an editorial gap claimed on a catalogue nobody could open, and never
    an error shown to the reader.
  why: >-
    Epic 2 / Story 2.8 and AD-15 — `R-UNAPPROVED-UNREACHABLE-DEGRADES`. The fallback is
